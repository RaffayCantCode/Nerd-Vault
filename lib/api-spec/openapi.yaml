openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NerdVault V2 API Specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: catalog
    description: Media catalog and discover operations
  - name: vault
    description: Personal vault tracking operations
  - name: shelves
    description: Custom shelves and collections
  - name: social
    description: Friends and activity feed operations
  - name: profile
    description: User profile and Taste DNA stats
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /catalog/home:
    get:
      operationId: getHomeFeed
      tags: [catalog]
      summary: Get home feed with spotlight, rails, and weekly drop
      responses:
        "200":
          description: Home feed data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeFeedResponse"

  /vault:
    get:
      operationId: getVault
      tags: [vault]
      summary: Get user vault items and stats
      responses:
        "200":
          description: User vault items and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthMeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            bio:
              type: string
            image:
              type: string

    HomeFeedResponse:
      type: object
      properties:
        featured:
          type: object
        continueWatching:
          type: array
          items:
            type: object
        curatedForYou:
          type: array
          items:
            type: object

    VaultResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        stats:
          type: object
